name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # apps/api's test suite (test/authorization.test.ts) is a real
    # integration suite against Postgres, not mocks — it needs a live
    # database to run migrations and exercise actual authorization queries.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: homework_portal_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PORTAL_DB_HOST: localhost
      PORTAL_DB_PORT: 5432
      PORTAL_DB_NAME: homework_portal_test
      PORTAL_DB_USER: postgres
      PORTAL_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # packages/* must build before apps/* — see README "Tests" section.
      - run: npm run build

      # apps/api's main build only type-checks src/ (test/ is excluded so
      # test files never land in dist/) — check test/ separately.
      - run: npm run typecheck:test --workspace=apps/api

      - run: npm test

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      # Build-only smoke test: proves both images actually build from a
      # clean checkout (workspace resolution, build ordering, Dockerfile
      # COPY paths) without needing a running database or pushing anywhere.
      - name: Build api image
        run: docker build -f apps/api/Dockerfile -t homework-portal-api:ci .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t homework-portal-web:ci .
