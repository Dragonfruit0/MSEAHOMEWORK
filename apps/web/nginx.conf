server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any non-file path falls back to index.html so React
    # Router's client-side routes (e.g. /admin, /homework/5) work on a
    # hard reload or direct link, not just client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API and web are separate containers; proxying /api here keeps the
    # browser talking to a single origin so the refresh-token cookie (set
    # with no explicit Domain) is sent on every request without extra CORS
    # configuration.
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 55m;
    }
}
